name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/library
      AUTH_SECRET: ci-only-placeholder-secret-not-for-production
      NEXTAUTH_SECRET: ci-only-placeholder-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_ENDPOINT: http://localhost:3000
      NEXT_PUBLIC_PROD_API_ENDPOINT: https://example.com
      NEXT_PUBLIC_IMAGEKIT_PUBLIC_KEY: ci-public-key
      NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: https://ik.imagekit.io/example
      IMAGEKIT_PRIVATE_KEY: ci-private-key-placeholder
      UPSTASH_REDIS_URL: https://example.upstash.io
      UPSTASH_REDIS_TOKEN: ci-upstash-token-placeholder
      QSTASH_URL: https://qstash.upstash.io
      QSTASH_TOKEN: ci-qstash-token-placeholder
      EMAILJS_SERVICE_ID: ci-email-service
      EMAILJS_TEMPLATE_ID: ci-email-template
      EMAILJS_PUBLIC_KEY: ci-email-public-key
      EMAILJS_PRIVATE_KEY: ci-email-private-key
      RESEND_TOKEN: ci-resend-token-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency security audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a = require("./npm-audit.json"); console.log(JSON.stringify({metadata: a.metadata?.vulnerabilities, vulnerabilities: Object.entries(a.vulnerabilities || {}).map(([name, v]) => ({name, severity: v.severity, isDirect: v.isDirect, range: v.range, fixAvailable: v.fixAvailable}))}, null, 2))'
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e 'const a = require("./npm-audit-production.json"); console.log("Production dependency audit:", JSON.stringify(a.metadata?.vulnerabilities || a.error || {}, null, 2))'
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
