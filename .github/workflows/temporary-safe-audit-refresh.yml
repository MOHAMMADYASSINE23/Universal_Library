name: Temporary safe dependency refresh

on:
  push:
    branches: [security/safe-audit-fixes]

permissions:
  contents: write

concurrency:
  group: safe-audit-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply compatible dependency security fixes
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Commit compatible dependency updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No compatible lockfile changes are available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: apply compatible dependency audit fixes"
          git push origin HEAD:${{ github.ref_name }}
