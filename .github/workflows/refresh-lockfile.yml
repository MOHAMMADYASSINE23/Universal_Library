name: Refresh security dependency lockfile
on:
  push:
    branches:
      - security/next-15-migration
permissions:
  contents: write
concurrency:
  group: lockfile-refresh-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/next-15-migration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply safe dependency fixes and refresh lockfile
        run: |
          npm audit fix --no-fund || true
          npm install --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "security: apply safe dependency audit fixes"
          git push origin security/next-15-migration
