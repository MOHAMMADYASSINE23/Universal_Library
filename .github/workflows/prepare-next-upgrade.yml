name: Retire temporary migration runner
on:
  push:
    branches:
      - security/next-15-migration
permissions:
  contents: read
concurrency:
  group: next-upgrade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Temporary migration runner retired."
